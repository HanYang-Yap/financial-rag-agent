[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-rag-agent"
version = "0.1.0"
description = "Enterprise Document Intelligence & Financial RAG Agent API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "qdrant-client>=1.8.0",
    "langchain>=0.1.12",
    "langchain-community>=0.0.28",
    "langchain-openai>=0.0.8",
    "tiktoken>=0.6.0",
    "pypdf>=4.1.0",
    "redis>=5.0.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "pre-commit>=3.6.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
